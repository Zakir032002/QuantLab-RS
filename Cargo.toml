[workspace]
members = ["crates/*"]
default-members = ["crates/qlrs-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zakir032002/QuantLab-RS"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
overflow-checks = true

[profile.bench]
inherits = "release"

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }
arbitrary = { version = "=1.5.0", default-features = false }
qlrs-num = { path = "crates/qlrs-num", version = "=0.1.0" }
qlrs-schema = { path = "crates/qlrs-schema", version = "=0.1.0" }
qlrs-io = { path = "crates/qlrs-io", version = "=0.1.0" }
qlrs-ledger = { path = "crates/qlrs-ledger", version = "=0.1.0" }
qlrs-check = { path = "crates/qlrs-check", version = "=0.1.0" }
qlrs-reduce = { path = "crates/qlrs-reduce", version = "=0.1.0" }
qlrs-bundle = { path = "crates/qlrs-bundle", version = "=0.1.0" }
qlrs-cli = { path = "crates/qlrs-cli", version = "=0.1.0" }
qlrs-testkit = { path = "crates/qlrs-testkit", version = "=0.1.0" }
qlrs-bench = { path = "crates/qlrs-bench", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
rayon = { version = "=1.12.0" }
blake3 = { version = "=1.8.7" }
foldhash = { version = "=0.2.0" }
clap = { version = "=4.6.7", features = ["derive"] }
proptest = { version = "=1.12.0" }
num-bigint = { version = "=0.4.8" }
criterion = { version = "=0.8.2" }
gungraun = { version = "=0.20.0" }

[profile.test]
opt-level = 1
